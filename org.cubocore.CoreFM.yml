app-id: org.cubocore.CoreFM
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: corefm
rename-desktop-file: cc.cubocore.CoreFM.desktop
rename-icon: cc.cubocore.CoreFM
rename-appdata-file: cc.cubocore.CoreFM.metainfo.xml
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=host # For accessing the external devices, and also for browsing the files in the entire filesystem.
  - --device=dri
  - --system-talk-name=org.freedesktop.UDisks2 # Getting the disk informationetcetc
  - --talk-name=org.freedesktop.Notifications
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/pkgconfig
  - /man
  - /share/man
  - /lib/*.la
  - /lib/*.a
modules:
  - name: libcprime
    buildsystem: cmake-ninja
    config-opts: [
        "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    ]
    sources:
      - type: git
        url: https://gitlab.com/cubocore/libcprime.git
        commit: 17d4c94f3be2c7f67dc757cf852f0144945c2c69
        tag: v5.0.1
  - name: libcsys
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://gitlab.com/cubocore/libcsys.git
        commit: de841ad0eb9bedda8122d98c092ba58324e048b4
        tag: v5.0.1
  - name: corefm
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://gitlab.com/cubocore/coreapps/corefm.git
        commit: 9689c4bac303c9fb4e4d26fe310411b76a8896b0
        tag: v5.0.1
      - type: patch
        path: fix-icon-name.patch

